[package]
name = "spotify-terminal"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rustfft = "6.2"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"
palette = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
unicode-width = "0.2"
anyhow = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
rspotify = { version = "0.13", features = ["cli"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dotenvy = "0.15"
futures = "0.3"
webbrowser = "1.2"


